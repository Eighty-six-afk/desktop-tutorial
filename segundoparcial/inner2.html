<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejemplo innerHTML - Agregar imagen</title>
</head>
<body>
    <div id="imagen"></div>
    <script>
        document.getElementById("imagen").innerHTML = '<img src="logo.jpeg" alt="Logo">';
    </script>
</body>
</html>
