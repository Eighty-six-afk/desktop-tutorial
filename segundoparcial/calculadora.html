<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Operaciones Switch</title>
</head>
<body>
    <script>
        let num1 = Number(prompt('Ingresa el primer número'));
        let num2 = Number(prompt('Ingresa el segundo número'));
        let opcion = Number(prompt('Elige una operación: \n1 - Suma \n2 - Resta \n3 - Multiplicación'));

        let resultado;

        switch(opcion){
            case 1:
                resultado = num1 + num2;
                document.write('La suma de ' + num1 + ' + ' + num2 + ' es: ' + resultado);
                break;
            case 2:
                resultado = num1 - num2;
                document.write('La resta de ' + num1 + ' - ' + num2 + ' es: ' + resultado);
                break;
            case 3:
                resultado = num1 * num2;
                document.write('La multiplicación de ' + num1 + ' * ' + num2 + ' es: ' + resultado);
                break;
            default:
                document.write('Opción no válida');
                break;
        }
    </script>
</body>
</html>
