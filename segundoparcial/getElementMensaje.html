<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejemplo getElementById - Mostrar mensaje</title>
</head>
<body>
    <p id="aviso">Mensaje inicial</p>
    <script>
        var elemento = document.getElementById("aviso");
        elemento.textContent = "Hola Estudiantes";
    </script>
</body>
</html>
